name: Samples CI

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/samples-ci.yml'
      - 'samples/**'
      - 'src/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/samples-ci.yml'
      - 'samples/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SAMPLES_SOLUTION: samples/Mvp24Hours.Samples.slnx

concurrency:
  group: samples-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all samples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SAMPLES_SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SAMPLES_SOLUTION }} --configuration Release --no-restore

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SAMPLES_SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SAMPLES_SOLUTION }} --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test ${{ env.SAMPLES_SOLUTION }}
          --configuration Release
          --no-build
          --filter "Category=Unit"
          --verbosity normal
          --logger "trx;LogFileName=samples-unit.trx"
          --results-directory ./test-results/samples-unit

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samples-unit-test-results
          path: test-results/samples-unit/*.trx
          if-no-files-found: warn

  test-integration:
    name: Integration tests (Docker)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SAMPLES_SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SAMPLES_SOLUTION }} --configuration Release --no-restore

      - name: Run integration tests
        run: >
          dotnet test ${{ env.SAMPLES_SOLUTION }}
          --configuration Release
          --no-build
          --filter "Category=Integration"
          --verbosity normal
          --logger "trx;LogFileName=samples-integration.trx"
          --results-directory ./test-results/samples-integration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samples-integration-test-results
          path: test-results/samples-integration/*.trx
          if-no-files-found: warn
