name: "Close Stale Issues and PRs"

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Mark/Close stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issues
          stale-issue-message: |
            This issue was automatically marked as stale because it has had no recent activity.
            It will be closed in 7 days if no additional activity occurs.
            
            If you believe this issue is still relevant, please add a comment.
            Thank you for your contributions! 🙏
          
          close-issue-message: |
            This issue was automatically closed due to inactivity.
            
            If you believe this issue is still relevant, feel free to reopen it.
            Thank you! 🙏
          
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,enhancement,bug'
          
          # Pull Requests
          stale-pr-message: |
            This Pull Request was automatically marked as stale because it has had no recent activity.
            It will be closed in 14 days if no additional activity occurs.
            
            If you are still working on this, please add a comment.
            Thank you for your contribution! 🎉
          
          close-pr-message: |
            This Pull Request was automatically closed due to inactivity.
            
            If you still want to contribute these changes, feel free to reopen the PR.
            Thank you! 🙏
          
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,work-in-progress'
