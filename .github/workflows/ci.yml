name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION_PATH: src/Mvp24Hours.slnx

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Para GitVersion e análise de código

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: 🏗️ Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    - name: 🧪 Run tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal --logger trx --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory ./test-results

    - name: 📊 Coverage regression gate
      if: matrix.os == 'ubuntu-latest'
      shell: pwsh
      env:
        COVERAGE_LINE_MIN: '37'
        COVERAGE_LINE_TARGET: '95'
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool --ignore-failed-sources
        reportgenerator -reports:"test-results/**/coverage.cobertura.xml" -targetdir:"./test-results/coverage-report" -reporttypes:"JsonSummary" -assemblyfilters:"+Mvp24Hours*"
        ./scripts/check-coverage-gate.ps1 -SummaryJsonPath ./test-results/coverage-report/Summary.json -MinimumLineCoverage $env:COVERAGE_LINE_MIN -TargetLineCoverage $env:COVERAGE_LINE_TARGET

    - name: 📊 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: '**/*.trx'

    - name: 📈 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: '**/coverage.cobertura.xml'
        flags: unittests
        name: codecov-${{ matrix.os }}

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Full style gate (task 7.2 / v2): whitespace + imports + analyzer code-style fixes.
    # Exclusions: IDE0130 crashes MSBuildWorkspace (dotnet/format#2192); IDE1006 has no
    # Fix All (NamingStyleCodeFixProvider) and stays suggestion in .editorconfig.
    # Solution lives under src/ — a bare `dotnet format` from repo root cannot find a solution file.
    - name: 🎨 Check code formatting
      run: dotnet format ${{ env.SOLUTION_PATH }} --exclude-diagnostics IDE0130 IDE1006 --verify-no-changes --verbosity diagnostic

    # Strict quality gate (task 7.1 / v2): TreatWarningsAsErrors=true. Residual list is
    # only NU1510 (MvpResidualWarnings in src/Directory.Build.props).
    # --no-incremental forces a full recompile so warnings are actually re-emitted.
    - name: 🔍 Run static code analysis
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-incremental /p:TreatWarningsAsErrors=true

  package:
    name: Create NuGet Packages
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: 🏗️ Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    - name: 📦 Pack
      run: dotnet pack ${{ env.SOLUTION_PATH }} --configuration Release --no-build --output ./artifacts

    - name: 📤 Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 🔒 Run security scan
      run: |
        set -o pipefail
        # Solution lives under src/ — bare `dotnet list package` from repo root fails.
        dotnet list src/Mvp24Hours.slnx package --vulnerable --include-transitive 2>&1 | tee security-scan.log
        # Exit code of `dotnet list` stays 0 even when advisories exist; fail the job on hits.
        if grep -Eiq 'has the following vulnerable packages|tem os seguintes pacotes vulneráveis' security-scan.log; then
          echo "::error::Vulnerable NuGet packages were detected (see security-scan.log)."
          exit 1
        fi
        echo "No vulnerable packages detected across the solution."

    - name: 📤 Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results
        path: security-scan.log

