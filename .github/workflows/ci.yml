name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Para GitVersion e análise de código

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore dependencies
      run: dotnet restore

    - name: 🏗️ Build
      run: dotnet build --configuration Release --no-restore

    - name: 🧪 Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal --logger trx --collect:"XPlat Code Coverage"

    - name: 📊 Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: '**/*.trx'

    - name: 📈 Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.os == 'ubuntu-latest'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: '**/coverage.cobertura.xml'
        flags: unittests
        name: codecov-${{ matrix.os }}

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    # Formatting-only gate (whitespace + import ordering). `--severity error` skips
    # warning-level analyzer code fixes (CS8625/CS0618/CA*), whose churn is deferred to
    # v2 together with the residual warnings accepted in task 10.1. Solution lives under
    # src/ — a bare `dotnet format` from repo root cannot find a project/solution.
    - name: 🎨 Check code formatting
      run: dotnet format src/Mvp24Hours.sln --severity error --verify-no-changes --verbosity diagnostic

    # TreatWarningsAsErrors deferred: ~969 residual warnings accepted in phase 10.1
    # (see tasks/phase10-warnings-residual-net10-v1.md). Re-enable when residual ≈ 0.
    - name: 🔍 Run static code analysis
      run: dotnet build --configuration Release

  package:
    name: Create NuGet Packages
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 📦 Restore dependencies
      run: dotnet restore

    - name: 🏗️ Build
      run: dotnet build --configuration Release --no-restore

    - name: 📦 Pack
      run: dotnet pack --configuration Release --no-build --output ./artifacts

    - name: 📤 Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: 🔒 Run security scan
      run: |
        set -o pipefail
        # Solution lives under src/ — bare `dotnet list package` from repo root fails.
        dotnet list src/Mvp24Hours.sln package --vulnerable --include-transitive 2>&1 | tee security-scan.log
        # Exit code of `dotnet list` stays 0 even when advisories exist; fail the job on hits.
        if grep -Eiq 'has the following vulnerable packages|tem os seguintes pacotes vulneráveis' security-scan.log; then
          echo "::error::Vulnerable NuGet packages were detected (see security-scan.log)."
          exit 1
        fi
        echo "No vulnerable packages detected across the solution."

    - name: 📤 Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results
        path: security-scan.log

