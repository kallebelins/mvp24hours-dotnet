name: Keycloak Package CI

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/keycloak-ci.yml'
      - 'docs/_media/icon.png'
      - 'src/Directory.Build.props'
      - 'src/Directory.Packages.props'
      - 'src/Mvp24Hours.Core/**'
      - 'src/Mvp24Hours.Infrastructure/**'
      - 'src/Mvp24Hours.Infrastructure.Identity.Keycloak/**'
      - 'src/Tests/Mvp24Hours.Infrastructure.Identity.Keycloak.Test/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/keycloak-ci.yml'
      - 'docs/_media/icon.png'
      - 'src/Directory.Build.props'
      - 'src/Directory.Packages.props'
      - 'src/Mvp24Hours.Core/**'
      - 'src/Mvp24Hours.Infrastructure/**'
      - 'src/Mvp24Hours.Infrastructure.Identity.Keycloak/**'
      - 'src/Tests/Mvp24Hours.Infrastructure.Identity.Keycloak.Test/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TEST_PROJECT: src/Tests/Mvp24Hours.Infrastructure.Identity.Keycloak.Test/Mvp24Hours.Infrastructure.Identity.Keycloak.Test.csproj
  PACKAGE_PROJECT: src/Mvp24Hours.Infrastructure.Identity.Keycloak/Mvp24Hours.Infrastructure.Identity.Keycloak.csproj

concurrency:
  group: keycloak-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Build
        run: dotnet build "${{ env.TEST_PROJECT }}" --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test "${{ env.TEST_PROJECT }}" --configuration Release --no-build --filter "Category=Unit" --logger "trx;LogFileName=keycloak-unit.trx" --results-directory ./test-results/unit

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-unit-test-results
          path: test-results/unit/*.trx
          if-no-files-found: warn

  integration:
    name: Integration tests (Docker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Build
        run: dotnet build "${{ env.TEST_PROJECT }}" --configuration Release --no-restore

      - name: Run integration tests
        env:
          KEYCLOAK_REQUIRE_DOCKER: 'true'
        run: dotnet test "${{ env.TEST_PROJECT }}" --configuration Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=keycloak-integration.trx" --results-directory ./test-results/integration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-integration-test-results
          path: test-results/integration/*.trx
          if-no-files-found: warn

  package:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: [unit, integration]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.PACKAGE_PROJECT }}"

      - name: Pack
        run: dotnet pack "${{ env.PACKAGE_PROJECT }}" --configuration Release --no-restore --output ./artifacts

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
