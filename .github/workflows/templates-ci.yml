name: Templates CI

on:
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/templates-ci.yml'
      - 'templates/**'
      - 'src/**'
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/templates-ci.yml'
      - 'templates/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TEMPLATES_SOLUTION: templates/Mvp24Hours.Templates.slnx

concurrency:
  group: templates-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.TEMPLATES_SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.TEMPLATES_SOLUTION }} --configuration Release --no-restore

  test-unit:
    name: Unit smoke tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.TEMPLATES_SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.TEMPLATES_SOLUTION }} --configuration Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test ${{ env.TEMPLATES_SOLUTION }}
          --configuration Release
          --no-build
          --filter "Category=Unit"
          --verbosity normal
          --logger "trx;LogFileName=templates-unit.trx"
          --results-directory ./test-results/templates-unit

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: templates-unit-test-results
          path: test-results/templates-unit/*.trx
          if-no-files-found: warn
