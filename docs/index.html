<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>:: Mvp24Hours :: .NET 10 ::</title>
  <link rel="icon" type="image/png" href="https://kallebelins.github.io/mvp24hours-dotnet/_media/icon.png" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description"
    content="Project developed to contribute to the rapid construction of services with solutions and market trends.">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <style>
    .sidebar-nav ul:not(.app-sub-sidebar)>li:not(.file)::before {
      display: none !important;
      content: none !important;
    }

    .sidebar-nav li {
      color: #505d6b;
      font-size: 14px;
      font-weight: 400;
      overflow: hidden;
      text-decoration: none;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div id="app">Please wait...</div>
  <script>
    window.$docsify = {
      name: 'Mvp24Hours',
      repo: 'https://github.com/kallebelins/mvp24hours-dotnet',
      maxLevel: 5,
      subMaxLevel: 4,
      sidebarDisplayLevel: 1,
      homepage: 'en-us/home.md',
      loadSidebar: true,
      auto2top: true,
      loadFooter: true,
      relativePath: true,

      /* copy */
      copyCode: {
        buttonText: 'Copy to clipboard',
        errorText: 'Error',
        successText: 'Copied'
      },

      /* search */
      search: {
        maxAge: 86400000,
        paths: [],

        placeholder: 'Type to search',

        noData: 'No Results!',

        depth: 4,

        hideOtherSidebarContent: false
      },
      executeScript: true,
      ga: 'G-4DFGDVQGPQ'
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/ga.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/emoji.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//polyfill.io/v3/polyfill.min.js?features=String.prototype.normalize"></script>
  <script src="//cdn.jsdelivr.net/npm/@alertbox/docsify-footer/dist/docsify-footer.min.js"></script>
  <script src="https://unpkg.com/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>

</html>
